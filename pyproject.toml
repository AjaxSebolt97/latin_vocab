[project]
name = "latin-vocab"
version = "0.1.0"
description = "Parse Latin texts, analyze vocabulary frequency, and generate flashcards"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pytest>=9.0.3",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
